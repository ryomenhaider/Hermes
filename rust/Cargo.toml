[package]
name = "hermes-rust"
version = "0.1.0"
edition = "2024"

[lib]
name = "_rust"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "hermes"
path = "src/bin/hermes.rs"

[dependencies]
bytes = "1.12.1"
clap = { version = "4", features = ["derive"] }
pyo3 = { version = "0.27", features = ["extension-module"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "2.12"
rustls = "0.23"

[features]
abi3 = ["pyo3/abi3-py311"]

[dev-dependencies]
rcgen = "0.13"

[profile.dev]
debug = false
