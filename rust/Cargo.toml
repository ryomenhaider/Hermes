[package]
name = "hermes-rust"
version = "0.1.0"
edition = "2024"

[lib]
name = "_rust"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "hermes"
path = "src/bin/hermes.rs"

[features]
abi3 = []

[profile.dev]
debug = false

[dependencies]
chrono = "0.4.45"
clap = { version = "4", features = ["derive"] }
pyo3 = "0.30.1"
rustls = "0.23.46"
ureq = "2.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
polars = { version = "0.55.2", features = ["lazy", "csv", "parquet", "json"] }

[dev-dependencies]
rcgen = "0.14.10"
