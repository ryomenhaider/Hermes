[project]
name = "hermes-plt"
version = "0.2.14"
description = "Foundational intelligence data platform for acquiring, validating, normalizing, storing, and serving intelligence datasets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Hermes Non-Commercial License" }
authors = [
    { name = "Haider Ali & Hermes Team" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "aiohttp>=3.14.3",
    "fastparquet>=2026.5.0",
    "polars>=1.44.1",
    "pyarrow>=25.0.0",
    "pydantic",
    "pycountry>=24.6.1",
    "sec-cik-mapper>=1.1.23",
    "yfinance>=1.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["hermes"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "aioresponses>=0.7.6",
    "country-converter>=1.3.2",
    "mypy>=2.3.0",
    "openpyxl>=3.1.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["hermes"]
omit = ["tests/*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S"]
ignore = ["S101", "N801", "N805", "N806", "N818", "E701", "E402"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501", "N802", "N806", "F841", "F401"]
"hermes/features/country_risk_features/*" = ["E501", "N801", "N805", "N806", "E731"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = false
warn_redundant_casts = false
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = "hermes.features.country_risk_features.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hermes.connectors.*"
ignore_errors = true
