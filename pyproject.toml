[project]
name = "hermes-plt"
version = "0.2.22"
description = "Foundational intelligence data platform for acquiring, validating, normalizing, storing, and serving intelligence datasets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Elastic License 2.0 (ELv2)" }
authors = [
    { name = "Haider Ali & Hermes Team" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
yfinance = [
    "yfinance"
]
data = [
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
]

[tool.hatch.build.targets.sdist]
include = [
    "/hermes",
    "/README.md",
    "/LICENSE.md",
    "/pyproject.toml"
]

[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "hermes._rust"
python-source = "."

[dependency-groups]
dev = [
    "country-converter>=1.3.2",
    "maturin>=1.15.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "yfinance>=1.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["hermes"]
omit = ["tests/*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S"]
ignore = ["S101", "N801", "N805", "N806", "N818", "E701", "E402"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501", "N802", "N806", "F841", "F401"]
"hermes/features/country_risk_features/*" = ["E501", "N801", "N805", "N806", "E731"]
"hermes/parsing/xml_parser.py" = ["S314"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = false
warn_redundant_casts = false
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = "hermes.features.country_risk_features.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "hermes.connectors.*"
ignore_errors = true

[project.scripts]
hermes = "hermes.cli:app"
